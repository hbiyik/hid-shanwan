# Options for hid-shanwan, read when the module loads ("sudo make install"
# reloads it). They apply to the 0526 mode (PV58); these are the defaults.
# Numbers out of range are clamped; text that is not a number (Y/N for
# weak_pwm) stops the module from loading.
#
# weak_pwm:        Y sets the strength of the on/off weak (right) motor by
#                  software PWM, N keeps it on/off (any effect at full force)
# weak_pwm_period: PWM period in ms, in whole 8 ms USB windows; 64 gives
#                  8 steps (the 8th is on all the time), 56 gives 7, 48 gives 6
# weak_pwm_min:    windows the weak motor is on per period for the gentlest effect
# strong_min:      byte the strong (left) motor starts at, 64 = 0x40
#
# To try values without reloading (lost on reload):
#   echo 56 | sudo tee /sys/module/hid_shanwan/parameters/weak_pwm_period
options hid_shanwan weak_pwm=Y weak_pwm_period=64 weak_pwm_min=1 strong_min=64
